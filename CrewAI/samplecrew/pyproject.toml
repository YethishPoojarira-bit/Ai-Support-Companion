[project]
name = "samplecrew"
version = "0.1.0"
description = "SampleCrew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "azure-ai-inference>=1.0.0b9",
    "crewai[tools]==1.7.2",
    "litellm>=1.75,<1.77",
]

[project.scripts]
samplecrew = "samplecrew.main:run"
run_crew = "samplecrew.main:run"
train = "samplecrew.main:train"
replay = "samplecrew.main:replay"
test = "samplecrew.main:test"
run_with_trigger = "samplecrew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
